[project]
name = "vultr-model-catalog"
version = "0.0.2"
description = "Fetch and normalize a Model Document 2.4 catalog (Vultr Inference /v1/models)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Harris", email = "mharris@vultr.com" }]
maintainers = [{ name = "Matt Harris", email = "mharris@vultr.com" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/vultr/model-catalog-python"
Repository = "https://github.com/vultr/model-catalog-python"
Issues = "https://github.com/vultr/model-catalog-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vultr_model_catalog"
